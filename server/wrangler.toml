# 런던_디스패치 Cloudflare Worker 설정
# 설계: doc/200_설계/server/index.md §6.1 · 키 목록 단일 소스: src/env.ts (doc/200_설계/server/env.md §3.1)
# 비밀값(TOKEN_SECRET, LLM_API_KEY)과 갠홈 주인 회원 ID 목록(OWNER_MB_IDS, S3c)은 여기 적지 않는다. 운영은 `npx wrangler secret put <KEY>`, 로컬은 server/.dev.vars

name = "london-dispatch"
main = "src/index.ts"
compatibility_date = "2026-08-15"          # 설치된 workerd 1.20260815.1 이 지원하는 날짜 이하
compatibility_flags = ["nodejs_compat"]

# 비밀 아닌 설정 — 값은 env.ts 기본값과 같다(문자열로 적고 parseEnv 가 숫자로 변환)
[vars]
TOKEN_MIN_LEVEL = "10"                       # 2026-10-08 사용자 결정: 갠홈 관리자(10)만 글쓰기. 열람은 등급 2 이상(갠홈 PHP가 분기), PHP RB_CHATBOT_LEVEL과 같은 값
LLM_PROVIDER = "google"
LLM_MODEL = "gemini-3.1-pro-preview"        # S3f 주인이 설정 화면에서 모델을 고르기 전 기본 모델(R-ENV-002)
LLM_TIMEOUT_MS = "60000"
ALLOWED_FRAME_ANCESTORS = "http://london-gossip.my https://london-gossip.my"
RATE_LIMIT_PER_MIN = "20"
CONTEXT_MESSAGES = "40"
MEMORY_SUMMARY_THRESHOLD = "60"
LLM_MONTHLY_BUDGET_KRW = "100000"           # S3b 월 AI 비용 상한(원, 추정) — R-LLM-007
LLM_PRICE_INPUT_USD_PER_M = "0.3"           # S3f 단가표(server/src/llm/models.ts)에 없는 모델의 폴백 입력 단가(USD/1M 토큰)
LLM_PRICE_OUTPUT_USD_PER_M = "2.5"          # 단가표에 없는 모델의 폴백 출력+사고 단가(USD/1M 토큰)
KRW_PER_USD = "1400"                        # S3b 원/달러 환율

# 실행 위치 — 2026-10-08 운영 관찰: 홍콩(HKG) 데이터센터에서 실행되면 Gemini 가 400 FAILED_PRECONDITION(위치 미지원)을 돌려준다.
# Smart Placement 는 "여러 지역의 꾸준한 트래픽"이 있어야 옮기므로(한국 유저만인 이 서비스엔 부적합, 적용 후에도 local-HKG 유지 관찰) 쓰지 않는다.
# Placement Hint(2026-01 추가)로 실행 위치를 도쿄(GCP asia-northeast1 ≈ Cloudflare NRT)에 고정한다 — NRT 실행은 201 확인됨. 응답 헤더 cf-placement 가 remote-NRT 이면 적용된 것.
# mode 와 region 은 동시에 쓸 수 없다. 정적 화면도 이 위치에서 서빙된다(run_worker_first). deploy-20261008-1930.md 비고 참조
[placement]
region = "gcp:asia-northeast1"

# D1 — 스키마는 migrations/*.sql (doc/200_설계/server/db.md §7)
[[d1_databases]]
binding = "DB"
database_name = "london-dispatch"
database_id = "a1fd3686-6dd4-4586-a045-da5ecb16543b"      # 운영 D1 (2026-10-08 wrangler d1 create, 지인 계정)
migrations_dir = "migrations"

# 정적 화면 — ui 빌드 산출물을 /embed 로 서빙 (R-API-006)
[assets]
directory = "../ui/dist"
binding = "ASSETS"
run_worker_first = true                     # 정적 파일 요청도 Worker 를 거쳐 CSP 헤더를 붙인다
